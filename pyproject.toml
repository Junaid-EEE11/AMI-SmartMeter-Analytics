[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shift_ami"
version = "0.1.0"
description = "Trustworthy AMI Forecasting Under Behavioral Distribution Shift: Adaptive Conformal Prediction for Smart-Meter Load Forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PhD Research Initiative in Power Systems Analytics" }
]
keywords = [
    "smart-meter",
    "advanced-metering-infrastructure",
    "load-forecasting",
    "distribution-shift",
    "conformal-prediction",
    "adaptive-conformal-inference",
    "power-systems"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Energy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "polars-lts-cpu>=1.0.0",
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["ami"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
